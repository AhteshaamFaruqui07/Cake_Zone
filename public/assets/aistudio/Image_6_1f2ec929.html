<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CakeZone - Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container": "#f2ecf4",
            "on-secondary-container": "#645a7d",
            "on-secondary": "#ffffff",
            "on-secondary-fixed": "#1f1635",
            "tertiary": "#765b00",
            "primary-container": "#6750a4",
            "surface-bright": "#fdf7ff",
            "primary": "#4f378a",
            "on-primary-container": "#e0d2ff",
            "surface-container-low": "#f8f2fa",
            "on-secondary-fixed-variant": "#4b4263",
            "tertiary-container": "#c9a74d",
            "on-primary": "#ffffff",
            "primary-fixed-dim": "#cfbcff",
            "background": "#fdf7ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-highest": "#e6e0e9",
            "surface": "#fdf7ff",
            "surface-tint": "#6750a4",
            "on-tertiary-container": "#503d00",
            "inverse-surface": "#322f35",
            "inverse-on-surface": "#f5eff7",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-primary-fixed": "#22005d",
            "tertiary-fixed-dim": "#e7c365",
            "on-error-container": "#93000a",
            "secondary-container": "#e1d4fd",
            "on-primary-fixed-variant": "#4f378a",
            "on-tertiary": "#ffffff",
            "tertiary-fixed": "#ffdf93",
            "surface-dim": "#ded8e0",
            "on-surface": "#1d1b20",
            "secondary-fixed": "#e9ddff",
            "on-background": "#1d1b20",
            "inverse-primary": "#cfbcff",
            "on-tertiary-fixed-variant": "#594400",
            "secondary-fixed-dim": "#cdc0e9",
            "outline-variant": "#cbc4d2",
            "outline": "#7a7582",
            "error": "#ba1a1a",
            "primary-fixed": "#e9ddff",
            "surface-variant": "#e6e0e9",
            "secondary": "#63597c"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "fontFamily": {
            "headline": ["Public Sans"],
            "display": ["Public Sans"],
            "body": ["Public Sans"],
            "label": ["Public Sans"]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar -->
<header class="bg-surface sticky top-0 z-50 w-full shadow-sm">
<div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center bg-primary-container">
<img class="w-full h-full object-cover" data-alt="A luxurious artisanal cake logo with rich gold and warm brown tones against a soft cream backdrop, representing high-end bakery branding with exquisite typography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCtGwfamoWtmt5u344pIkL7As-GBsfcyExPz5SrzPuNio4NCOhWz-xk8j2pGXw3DvdD23tRVbL1ks4doTiqQ3K0CLEmnfIXN1gqT0HTY3Fe8pR9NLr-hOhhsCOSG1xRZ5dEMnJJwlWgnX07LXOVckSdAGdnX67X628kmktYo0ejqcrkog5tckJ4Cq94lzVuFKKR-XreRgkpLHaqUNEEWX8B3HRw6yvqrZC5WSl9cr44LZx5SGEd1hQCXCY2MdsnBXPnw"/>
</div>
<span class="text-xl font-black text-primary">CakeZone</span>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant hover:text-on-surface text-sm font-label transition-colors" href="#">Home</a>
<a class="text-on-surface-variant hover:text-on-surface text-sm font-label transition-colors" href="#">Collections</a>
<a class="text-on-surface-variant hover:text-on-surface text-sm font-label transition-colors" href="#">About</a>
<a class="text-on-surface-variant hover:text-on-surface text-sm font-label transition-colors" href="#">Custom Cakes</a>
<a class="text-on-surface-variant hover:text-on-surface text-sm font-label transition-colors" href="#">Contact</a>
</nav>
<div class="flex items-center gap-4">
<button aria-label="Shopping Bag" class="text-primary hover:text-primary-container transition-colors p-2">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="w-full max-w-md bg-surface-container-low rounded-xl shadow-lg p-8 border border-outline-variant/30">
<div class="text-center mb-8">
<h1 class="text-2xl font-headline font-bold text-on-surface mb-2">Create Account</h1>
<p class="text-sm text-on-surface-variant font-body">Join CakeZone to experience artisanal luxury pastry ordering.</p>
</div>
<form class="space-y-5" onsubmit="event.preventDefault();">
<div>
<label class="block text-sm font-label text-on-surface mb-1.5">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">person</span>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-label text-on-surface mb-1.5">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">mail</span>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="jane@example.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-label text-on-surface mb-1.5">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">lock</span>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-label text-on-surface mb-1.5">Confirm Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">lock_reset</span>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center gap-2">
<input class="rounded border-outline text-primary focus:ring-primary w-4 h-4" id="terms" required="" type="checkbox"/>
<label class="text-xs text-on-surface-variant font-label" for="terms">
            I agree to the <a class="text-primary hover:underline font-bold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-bold" href="#">Privacy Policy</a>
</label>
</div>
<button class="w-full py-3 px-4 bg-primary text-on-primary font-label font-bold rounded-xl shadow-md hover:bg-primary/90 active:scale-95 transition-all text-sm flex items-center justify-center gap-2" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-xs text-outline font-label">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center py-2.5 px-4 border border-outline-variant rounded-xl text-sm font-label text-on-surface bg-surface-container-lowest hover:bg-surface-container transition-colors" type="button">
<span>Google</span>
</button>
<button class="flex items-center justify-center py-2.5 px-4 border border-outline-variant rounded-xl text-sm font-label text-on-surface bg-surface-container-lowest hover:bg-surface-container transition-colors" type="button">
<span>Apple</span>
</button>
</div>
</form>
<div class="text-center mt-6">
<p class="text-sm text-on-surface-variant font-label">
          Already have an account? 
          <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container-low w-full border-t border-outline-variant">
<div class="flex flex-col md:flex-row justify-between items-center px-6 py-8 max-w-7xl mx-auto gap-6">
<div class="text-sm text-on-surface-variant font-label">
        © 2023 CakeZone. All rights reserved.
      </div>
<div class="flex flex-wrap gap-6 text-sm font-label">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">FAQ</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Shipping Info</a>
</div>
</div>
</footer>
</body></html>
